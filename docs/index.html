<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olden Era — Reference</title>
<script>
  // CRITICAL: insert <base> BEFORE the stylesheet / scripts below so their
  // relative URLs (style.css, data.js, dist/app.js) always resolve to the
  // application root — not to wherever history.replaceState moves the URL.
  // Without this, deep paths like /buildings/necropolis cause every relative
  // <script src="data.js"> to resolve to /buildings/data.js → 404 → React
  // never mounts → blank page.
  (function () {
    var base = document.createElement('base');
    base.href = location.pathname.indexOf('/homm-olden/') === 0 ? '/homm-olden/' : '/';
    document.head.appendChild(base);
  })();
</script>
<link rel="stylesheet" href="style.css">
<script>
  // SPA single-page-shim: 404.html stuffed the original deep path into a query
  // param (?p=units/temple) so GitHub Pages could serve us. Recover and replay
  // it via replaceState so the SPA sees the right URL on first parse.
  (function () {
    var loc = window.location;
    if (loc.search.indexOf('?p=') === 0 || loc.search.indexOf('&p=') !== -1) {
      var qs = loc.search.slice(1).split('&');
      var rest = [];
      var p = '';
      for (var i = 0; i < qs.length; i++) {
        if (qs[i].indexOf('p=') === 0) p = decodeURIComponent(qs[i].slice(2));
        else rest.push(qs[i]);
      }
      if (p) {
        var newQs = rest.length ? '?' + rest.join('&') : '';
        history.replaceState(null, null,
          loc.pathname.replace(/\/$/, '') + '/' + p.replace(/^\//, '') + newQs + loc.hash);
      }
    }
  })();
</script>
</head>

<div id="root"></div>
