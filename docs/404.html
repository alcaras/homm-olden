<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Olden Era — Reference</title>
<script>
  // GitHub Pages SPA fallback (Rafael Pedicini's spa-github-pages pattern).
  // GitHub Pages serves this file for any unknown deep path. We re-encode the
  // path into a ?p=... query and redirect to index.html, which has a head
  // script that recovers the path back via history.replaceState.
  //
  // pathSegmentsToKeep = 1 because the site lives at /homm-olden/ — keep that
  // first segment so /homm-olden/units/temple → /homm-olden/?p=units/temple
  // (instead of /?p=homm-olden/units/temple).
  (function () {
    var pathSegmentsToKeep = 1;
    var l = window.location;
    var keep = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/';
    var rest = l.pathname.slice(keep.length);
    var qs = l.search.slice(1);
    var combined = qs ? '&' + qs : '';
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      keep + '?p=' + encodeURIComponent(rest) + combined + l.hash
    );
  })();
</script>
</head>
<body></body>
</html>
